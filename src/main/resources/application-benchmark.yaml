spring:
  config:
    activate:
      on-profile: benchmark

  datasource:
    url: jdbc:postgresql://127.0.0.1:${BENCHMARK_POSTGRES_PORT:5433}/${BENCHMARK_POSTGRES_DB:community_benchmark}
    username: ${BENCHMARK_POSTGRES_USER:community_benchmark}
    password: ${BENCHMARK_POSTGRES_PASSWORD}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: ${BENCHMARK_JDBC_BATCH_SIZE:100}
        order_inserts: true

app:
  benchmark:
    generator:
      enabled: false
      post-count: 1000
      author-count: 100
      persistence-batch-size: 1000
      seed: 20260802
