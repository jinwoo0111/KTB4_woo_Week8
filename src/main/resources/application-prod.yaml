spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:community}
    username: ${POSTGRES_USER:community_user}
    password: ${POSTGRES_PASSWORD:community_password}

  jpa:
    show-sql: false

app:
  cors:
    allowed-origins: []
