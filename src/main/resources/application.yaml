server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:h2:file:${DB_PATH:./data/community}
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

jwt:
  secret: ${JWT_SECRET}

app:
  storage:
    upload-root: ${UPLOAD_PATH:./uploads}
  cors:
    allowed-origins: []

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health
  endpoint:
    health:
      enabled: true
      probes:
        enabled: false
      show-components: never
      show-details: never
