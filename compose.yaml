services:
  postgres:
    image: postgres:16-alpine
    container_name: community-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-community}
      POSTGRES_USER: ${POSTGRES_USER:-community_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-community_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-binarywoo0111}/community-backend:latest
    container_name: community-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-community}
      POSTGRES_USER: ${POSTGRES_USER:-community_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-community_password}
      JWT_SECRET: ${JWT_SECRET:-your_default_jwt_secret_key_here}
    ports:
      - "8080:8080"
    volumes:
      - community-uploads:/app/uploads

  frontend:
    build:
      context: ../community-react
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-binarywoo0111}/community-frontend:latest
    container_name: community-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres-data:
  community-uploads:
